name: Deploy argocd on GKE

on:
  push:
    branches:
    - develop
    - staging
    - main
  pull_request:
    branches:
    - develop
    - staging
    - main
  workflow_dispatch:
    
env:
  GOOGLE_APPLICATION_CREDENTIALS: "${HOME}/gcp-key.json"  
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

jobs:
  develop:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 
        uses: actions/checkout@v3

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Set up GCP authen
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > "${HOME}/gcp-key.json"
          ls -la ${HOME}
          gcloud auth activate-service-account --key-file="${HOME}/gcp-key.json"
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Install kubectl
        run: |
          gcloud components install kubectl
          kubectl version --client

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh"  | bash
          kustomize version

      - name: List GKE Clusters
        run: |
          echo "Listing GKE Clusters"
          gcloud container clusters list

      - name: Configure kubectl for GKE
        run: |
          echo "Configuring kubeconfig"
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} --region ${{ secrets.GKE_REGION }} --project ${{ secrets.GCP_PROJECT_ID }}
          kubectl config view

      - name: Kustomize file 
        run: |
          kubectl kustomize argocd/overlays/dev > /tmp/argocd.yaml
          cat /tmp/argocd.yaml

      - name: Apply yaml
        run: |
          kubectl apply -f /tmp/argocd.yaml

      - name: Apply config cert-manager
        run: |
          pwd
          ls -la
          kubectl apply -f helm/infrastructure/cert-manager/Clusterissuer.yaml

