apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  generators:
  - list:
      elements:
        - cluster: in-cluster
  template:
    metadata:
      name: "cert-manager"
    spec:
      project: infrastructure
      source:
        repoURL: https://charts.jetstack.io  
        chart: cert-manager                 
        targetRevision: "v1.16.4"           
        helm:
          releaseName: "cert-manager"
          valueFiles:
            - https://raw.githubusercontent.com/sudo-yama/devops-assignment-cd/develop/helm/infrastructure/cert-manager/values-config.yaml           
      destination:
        server: https://kubernetes.default.svc
        namespace: cert-manager            
      syncPolicy:
        automated:
          prune: true                       
          selfHeal: true                    
