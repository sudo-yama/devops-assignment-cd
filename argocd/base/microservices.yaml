apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golang-api
  namespace: argocd
spec:
  generators:
  - list:
      elements:
        - cluster: in-cluster
  template:
    metadata:
      name: "golang-api"
    spec:
      project: microservices
      source:
        repoURL: https://github.com/sudo-yama/devops-assignment-cd.git
        targetRevision: "$(argo_branch)"
        path: helm/microservices/golang-api
        helm:
          releaseName: "golang-api"
          valueFiles:   
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "$(argo_ns)"
      syncPolicy:  
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: redis
  namespace: argocd 
spec:
  generators:
  - list:
      elements:
        - cluster: in-cluster
  template:
    metadata:
      name: "redis"
    spec:
      project: microservices
      source:
        chart: redis
        repoURL: https://charts.bitnami.com/bitnami
        targetRevision: 18.0.3 
        helm:
          releaseName: "redis"
          valueFiles:
            - https://raw.githubusercontent.com/sudo-yama/devops-assignment-cd/main/helm/microservices/redis/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "$(argo_ns)"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true