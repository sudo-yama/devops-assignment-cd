apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus-grafana
  namespace: argocd
spec:
  generators:
  - list:
      elements:
        - cluster: in-cluster
  template:
    metadata:
      name: "monitoring"
    spec:
      project: monitoring
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        targetRevision: 58.2.1
        chart: kube-prometheus-stack
        helm:
          releaseName: "monitoring"
          valueFiles:
            - https://raw.githubusercontent.com/sudo-yama/devops-assignment-cd/refs/heads/develop/helm/monitoring/values-dev.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true