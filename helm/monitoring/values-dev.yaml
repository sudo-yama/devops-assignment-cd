grafana:
  adminPassword: "supersecurepassword"
  service:
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.i-heng.store
  tls:
    - secretName: grafana-tls 
      hosts:
        - grafana.i-heng.store
