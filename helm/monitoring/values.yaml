grafana:
  adminPassword: "supersecurepassword"
  service:
    type: LoadBalancer
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - host: grafana.i-heng.store
        paths:
          - path: /
            pathType: Prefix
            
prometheus:
  service:
    type: LoadBalancer
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt"
      kubernetes.io/ingress.class: "nginx"
    hosts:
      - host: prometheus.i-heng.store
        paths:
          - path: /
            pathType: Prefix

