replicaCount: 2

image:
  repository: weerapatx/hello-go-api
  tag: develop-7678033
  pullPolicy: IfNotPresent

container:
  name: hello-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metrics:
    cpu:
      enabled: true
      averageUtilization: 50
    memory:
      enabled: true
      averageUtilization: 70 

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: api.i-heng.store
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: my-app
              port:
                number: 8080
  tls:
    - secretName: golang-api-tls
      hosts:
        - api.i-heng.store
