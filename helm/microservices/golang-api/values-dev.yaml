replicaCount: 1

image:
  tag: develop-2c22d46
  pullPolicy: IfNotPresent

container:
  name: hello-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metrics:
    cpu:
      enabled: true
      averageUtilization: 50
    memory:
      enabled: true
      averageUtilization: 70 

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: api.i-heng.store
      paths:
        - path: /
          pathType: Prefix
